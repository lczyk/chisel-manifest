name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * 1" # mondays, 06:17 UTC
    #
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream chisel tag to mirror (defaults to the latest release)
        type: string
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write       # keepalive, and dispatching CI on the PR branch
      contents: write      # push the sync branch
      issues: write        # report scheduled failures
      pull-requests: write # open / update the PR
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: sync-upstream
    steps:
      # GitHub disables schedules in public repos after 60 days without activity,
      # and this repo can go months between upstream releases.
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yaml/enable"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Highest semver rather than GitHub's "latest", so a backport release on an
      # older series is never proposed as a downgrade.
      - name: Mirror upstream
        id: upstream
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          from="$(./.github/scripts/sync-upstream.sh --tracked)"
          to="${INPUT_REF:-$(gh release list --repo canonical/chisel --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | sort -V | tail -n 1)}"
          : "${to:?could not resolve the latest upstream release}"
          ./.github/scripts/sync-upstream.sh "${to}"
          printf 'from=%s\nto=%s\n' "${from}" "${to}" >> "${GITHUB_OUTPUT}"

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true
          sign-commits: true
          commit-message: "feat: mirror chisel manifest ${{ steps.upstream.outputs.to }}"
          title: "feat: mirror chisel manifest ${{ steps.upstream.outputs.to }}"
          body: |
            Mirrors the manifest modules from canonical/chisel [${{ steps.upstream.outputs.to }}](https://github.com/canonical/chisel/releases/tag/${{ steps.upstream.outputs.to }}).

            Upstream changes: https://github.com/canonical/chisel/compare/${{ steps.upstream.outputs.from }}...${{ steps.upstream.outputs.to }}

            Opened by [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Remember to tag `${{ steps.upstream.outputs.to }}` after merging.

      - name: Run CI on the pull request
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh workflow run ci.yaml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"

      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          TITLE: Upstream sync is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${issue}" ]; then
            gh issue comment "${issue}" --repo "${GITHUB_REPOSITORY}" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "Scheduled sync failed: ${RUN_URL}"
          fi
